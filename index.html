<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koruna Evropy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<style>
:root{
  --bg:#0b1d14;
  --bg-soft:#102a1c;
  --card:#153524;
  --card-hover:#1b422c;
  --card-caucasus:#112a1c; 
  --border:#28513a;
  --border-soft:#1e3d29;
  --text:#eef3ea;
  --text-muted:#9db6a4;
  --text-faint:#6f8b78;
  --accent:#dba641;
  --accent-strong:#f0bd5f;
  --peak:#7fb0a0;
  --caucasus-fill:#173322; 
  --caucasus-stroke:#365c44;
  --bonus:#4a7c59; 
  --bonus-strong:#64a377;
  --danger:#c96f5f;
  --radius:16px;
  --radius-sm:10px;
  --font-display:'League Spartan',sans-serif;
  --font-body:'Poppins',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(219,166,65,0.08), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(127,176,160,0.08), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-weight:400;
  min-height:100vh;
}
#root{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:0.01em;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important;} }

.hero{position:relative;border-radius:22px;padding:34px 30px;overflow:hidden;
  background:linear-gradient(160deg,var(--bg-soft) 0%, #0d2318 100%);
  border:1px solid var(--border-soft);margin-bottom:26px;}
.hero-contours{position:absolute;inset:0;opacity:0.35;pointer-events:none;}
.hero-top{position:relative;z-index:1;}

.hero-main-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 12px; }
.hero-titles { flex: 1; min-width: 250px; }
.hero-brand { display: flex; align-items: center; flex-shrink: 0; }
.brand-logo { height: 90px; width: auto; object-fit: contain; margin: -10px 0; }

.hero-eyebrow{font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent-strong);font-weight:600;margin-bottom:8px;}
.hero h1{font-size:clamp(30px,4.2vw,44px);font-weight:800;color:var(--text);line-height:1;margin:0;}
.hero p.sub{color:var(--text-muted);font-size:15px;line-height:1.5;margin:0;max-width:600px;}

.progress-row{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap;position:relative;z-index:1;}
.progress-card{flex:1;min-width:200px;background:rgba(12,29,20,0.55);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:16px 18px;}
.progress-card .plabel{font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);font-weight:500;}
.progress-card .pnum{font-family:var(--font-display);font-size:32px;font-weight:700;margin-top:4px;color:var(--text);}
.progress-card .pnum span{color:var(--text-faint);font-size:18px;font-weight:500;}
.bar-track{height:7px;border-radius:5px;background:rgba(255,255,255,0.06);margin-top:12px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;transition:width .5s ease;}
.bar-fill.peaks{background:linear-gradient(90deg,var(--accent),var(--accent-strong));}

.methodology-box { background: rgba(12, 29, 20, 0.4); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 18px 22px; margin-top: 24px; position: relative; z-index: 1; }
.methodology-box h3 { font-size: 15px; color: var(--accent-strong); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--font-body); font-weight: 600; }
.methodology-box p { color: var(--text-muted); font-size: 13.5px; line-height: 1.6; margin: 0; }

.map-wrap{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border-soft);margin-bottom:26px;position:relative;background:#081209;}
#mapCanvas{width:100%;height:480px;background:#081209;z-index:1;}
.map-legend{position:absolute;bottom:16px;left:16px;z-index:400;background:rgba(11,29,20,0.88);border:1px solid var(--border-soft);border-radius:10px;padding:9px 13px;font-size:12px;color:var(--text-muted);display:flex;gap:14px;flex-wrap:wrap;backdrop-filter:blur(4px);pointer-events:none;}
.map-legend .li{display:flex;align-items:center;gap:6px;}
.leaflet-container .leaflet-control-attribution{background:rgba(11,29,20,0.7) !important;color:var(--text-faint) !important;}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.toolbar input[type="text"]{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border-soft);color:var(--text);padding:10px 14px;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:14px;}
.toolbar input[type="text"]::placeholder{color:var(--text-faint);}
.toolbar select{background:var(--card);border:1px solid var(--border-soft);color:var(--text);padding:10px 12px;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:14px; cursor:pointer;}
.count-pill{font-size:12px;color:var(--text-muted);white-space:nowrap;}

.country-card{background:var(--card);border:1px solid var(--border-soft);border-left:3px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden;transition:border-color .2s ease, background .2s ease;}
.country-card.caucasus-card{background:var(--card-caucasus);border-color:#173322;border-left-color:var(--caucasus-stroke);}
.country-card[data-status="full"]{border-left-color:var(--accent);}
.bonus-card[data-status="full"]{border-left-color:var(--bonus);}
.country-card summary{list-style:none;cursor:pointer;}
.country-card summary::-webkit-details-marker{display:none;}
.card-head{display:flex;align-items:center;gap:14px;padding:14px 16px;}
.card-head:hover{background:var(--card-hover);}
.chevron{color:var(--text-faint);font-size:13px;transition:transform .2s ease;flex-shrink:0;}
details[open] .chevron{transform:rotate(90deg);}
.card-titles{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
.card-titles .cname{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--text);}
.card-titles .cmeta{font-size:13px;color:var(--text-muted);}
.caucasus-badge{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;background:rgba(0,0,0,0.25);padding:3px 7px;border-radius:5px;border:1px solid rgba(255,255,255,0.05);font-family:var(--font-body);font-weight:500;}

.card-body{padding:4px 16px 20px 44px;}

/* Zobrazení pro sledující (Viewer) */
.viewer-layout { display: flex; gap: 20px; align-items: flex-start; padding: 6px 0; }
.v-photo { width: 130px; height: 130px; object-fit: cover; border-radius: 12px; cursor: zoom-in; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid var(--border); }
.v-content { flex: 1; min-width: 0; }
.v-date { font-size: 13px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
.v-stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.v-stat { font-size: 15px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
.v-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.v-badge { background: rgba(0,0,0,0.3); border: 1px solid var(--border-soft); padding: 5px 12px; border-radius: 8px; font-size: 12.5px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.v-stars { display: flex; gap: 4px; font-size: 14px; }
.v-note { font-size: 14.5px; line-height: 1.6; color: var(--text); background: rgba(255,255,255,0.03); padding: 12px 18px; border-left: 3px solid var(--accent); border-radius: 4px 10px 10px 4px; font-style: italic; }
.empty-state { color: var(--text-faint); font-size: 14px; font-style: italic; padding: 10px 0; }

/* Admin formulář */
.admin-layout { border-top: 1px dashed var(--border-soft); margin-top: 24px; padding-top: 24px; }
.item-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.check{width:24px;height:24px;border-radius:6px;border:2px solid var(--text-faint);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s ease;}
.check.checked{background:var(--accent);border-color:var(--accent);}
.check.checked.bonuscheck{background:var(--bonus);border-color:var(--bonus);}
.check svg{width:14px;height:14px;opacity:0;transition:opacity .1s ease;}
.check.checked svg{opacity:1;}
.item-label{font-weight:600;font-size:15px;}

.item-fields{display:flex;flex-direction:column;gap:12px;}
.item-fields input[type="datetime-local"], .item-fields input[type="text"], .item-fields input[type="number"]{
  background:var(--bg);border:1px solid var(--border-soft);color:var(--text);padding:9px 12px;border-radius:8px;font-family:var(--font-body);font-size:13.5px;width:100%;max-width:400px;}
.item-fields label.small{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;font-weight:500;}
.diff-badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;}

.stats-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; max-width:400px; }
.stats-row .stat-col { flex: 1; min-width: 100px; }
.stats-row input { width: 100% !important; margin-top: 4px;}

/* Rating Pills */
.rating-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom:4px; }
.rating-pill {
  background: var(--bg); border: 1px solid var(--border-soft); color: var(--text-faint);
  padding: 8px 14px; border-radius: 20px; font-size: 13px; font-family: var(--font-body); font-weight:500;
  cursor: pointer; transition: all 0.2s;
}
.rating-pill:hover { border-color: var(--rc); color: var(--rc); }
.rating-pill.active { background: var(--rc); color: #111; border-color: var(--rc); font-weight: 600; }

.photo-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.photo-btn{background:var(--border-soft);color:var(--text);border:1px solid var(--border);padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:var(--font-body);font-weight:500;}
.photo-btn:hover{background:var(--border);}
.photo-thumb{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:zoom-in;transition:opacity 0.2s ease;}
.photo-thumb:hover{opacity:0.8;}
.exif-hint{font-size:11px;color:var(--peak);}
.exif-hint.none{color:var(--text-faint);}

.clear-link{font-size:11px;color:var(--text-faint);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:var(--font-body);padding:0;}
.clear-link:hover{color:var(--danger);}

.bonus-section{margin-top:50px;}
.bonus-header{margin-bottom:14px;}
.bonus-header h2{font-size:22px;font-weight:700;color:var(--text);}
.bonus-header p{color:var(--text-muted);font-size:13.5px;margin-top:4px; line-height: 1.5;}
.add-form{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius-sm);margin-bottom:14px;padding:0 16px;}
.add-form summary{list-style:none;cursor:pointer;padding:14px 0;font-family:var(--font-body);font-weight:500;color:var(--accent-strong);font-size:13.5px;}
.add-form summary::-webkit-details-marker{display:none;}
.add-form-body{display:flex;flex-direction:column;gap:10px;padding-bottom:18px;max-width:420px;}
.add-form-body input{background:var(--bg-soft);border:1px solid var(--border-soft);color:var(--text);padding:9px 12px;border-radius:8px;font-family:var(--font-body);font-size:13.5px;}
.add-form-body .row2{display:flex;gap:10px;}
.add-form-body button{align-self:flex-start;background:var(--bonus);color:#ffffff;border:none;padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-family:var(--font-body);font-size:13.5px;}
.add-form-body button:hover{background:var(--bonus-strong);}

/* Admin Panel */
.admin-panel {
  text-align: center;
  margin-top: 40px;
  padding: 20px;
  background: var(--card);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  align-items: center;
}
.admin-panel button, .admin-panel .file-label-btn {
  background: var(--bg-soft);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  font-family: var(--font-body);
}
.admin-panel button:hover, .admin-panel .file-label-btn:hover { background: var(--border); }
.admin-panel .primary-btn { background: var(--accent); color: #111; border: none; font-weight: 500; }
.admin-panel .primary-btn:hover { background: var(--accent-strong); }

.footer-note{text-align:center;color:var(--text-faint);font-size:13px;margin-top:24px;line-height:1.6;}
.loading{text-align:center;color:var(--text-muted);padding:60px 0;font-size:14px;}
.save-indicator{position:fixed;bottom:18px;right:18px;background:var(--card);border:1px solid var(--border-soft);color:var(--text-muted);padding:8px 14px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s ease;pointer-events:none;z-index:9000;}
.save-indicator.show{opacity:1;}

/* Lightbox Modal */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px);cursor:pointer;}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.5);object-fit:contain;}

@media (max-width: 640px) {
  .hero-main-row { flex-direction: column; align-items: flex-start; gap: 16px; margin-bottom: 0; }
  .brand-logo { height: 70px; margin: 0; }
  .viewer-layout { flex-direction: column; gap: 16px; }
  .v-photo { width: 100%; height: 200px; }
}
</style>
</head>

/* ============================= API ============================= */
const API_BASE = "/api/data";
const api = {
  async list(prefix){
    const res = await fetch(API_BASE+"?prefix="+encodeURIComponent(prefix));
    if(!res.ok) return {keys:[]};
    return res.json();
  },
  async get(key){
    const res = await fetch(API_BASE+"?key="+encodeURIComponent(key));
    if(res.status===404) return null;
    const text = await res.text();
    if(!text || text==="null") return null;
    return {key, value:text};
  },
  async set(key, value){
    showSaving(true);
    await fetch(API_BASE, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({key,value})});
    showSaving(false);
    return {key,value};
  },
  async delete(key){
    await fetch(API_BASE+"?key="+encodeURIComponent(key), {method:"DELETE"});
    return {key, deleted:true};
  }
};
let saveTimer=null;
function showSaving(on){
  const el = document.getElementById('saveIndicator');
  if(!el) return;
  if(on){ el.classList.add('show'); el.textContent='Ukládám…'; }
  else{
    el.textContent='Uloženo';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=> el.classList.remove('show'), 900);
  }
}

function downloadBackup() {
  const dataToBackup = { state, bonusState };
  const blob = new Blob([JSON.stringify(dataToBackup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `koruna_evropy_zaloha_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function uploadBackup(ev) {
  const file = ev.target.files[0];
  if(!file) return;
  if(!confirm("Opravdu chceš přepsat svá aktuální data touto zálohou? (Tato akce je nevratná)")) {
    ev.target.value = '';
    return;
  }
  
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      showSaving(true);
      document.getElementById('saveIndicator').textContent = 'Obnovuji ze zálohy...';
      
      if(data.state) {
        for(const [id, entry] of Object.entries(data.state)) {
          state[id] = entry;
          await api.set("country_"+id, JSON.stringify(entry));
        }
      }
      if(data.bonusState) {
        for(const [id, entry] of Object.entries(data.bonusState)) {
          bonusState[id] = entry;
          await api.set("bonus_"+id, JSON.stringify(entry));
        }
      }
      
      showSaving(false);
      alert('Záloha úspěšně nahrána a uložena!');
      ev.target.value = ''; 
      renderAll();
    } catch(err) {
      alert('Chybný formát souboru zálohy.');
      showSaving(false);
      ev.target.value = '';
    }
  };
  reader.readAsText(file);
}

  if(SHARED_PEAKS[id]) {

      getEntry(targetId).peak = JSON.parse(JSON.stringify(getEntry(id).peak));
      await saveEntry(targetId);
  }
}

async function loadAll(){
  try{
    const listRes = await api.list("country_");
    const keys = listRes.keys || [];
    await Promise.all(keys.map(async k=>{
      const r = await api.get(k);
      if(r && r.value){
        const id = k.replace("country_","");
        try{ state[id] = Object.assign(emptyEntry(), JSON.parse(r.value)); }catch(e){}
      }
    }));
  }catch(e){ console.error("Chyba při načítání:", e); }

  try{
    const listRes2 = await api.list("bonus_");
    const keys2 = listRes2.keys || [];
    await Promise.all(keys2.map(async k=>{
      const r = await api.get(k);
      if(r && r.value){
        try{ const parsed = JSON.parse(r.value); bonusState[parsed.id] = Object.assign(emptyBonus(), parsed); }catch(e){}
      }
    }));
  }catch(e){ console.error("Chyba při načítání bonusů:", e); }

  // Auto-Migrace starých ID
  if (state['spain']) {
    if (state['spain'].peak && state['spain'].peak.done) {
      const bId = "b_teide";
      if(!bonusState[bId]) {
        bonusState[bId] = { ...emptyBonus(), id: bId, name: "Pico de Teide", region: "Španělsko (ostrovy)", elev: 3718, lat: 28.2723, lng: -16.6425, done: true, date: state['spain'].peak.date, diff: state['spain'].peak.diff, photo: state['spain'].peak.photo, photoDate: state['spain'].peak.photoDate, notes: state['spain'].peak.note, km: state['spain'].peak.km, elevGain: state['spain'].peak.elevGain, time: state['spain'].peak.time };
        await api.set("bonus_"+bId, JSON.stringify(bonusState[bId]));
      }
    }
    await api.delete("country_spain");
    delete state['spain'];
  }

  if (state['portugal']) {
    if (state['portugal'].peak && state['portugal'].peak.done) {
      const bId = "b_pico";
      if(!bonusState[bId]) {
        bonusState[bId] = { ...emptyBonus(), id: bId, name: "Ponta do Pico", region: "Portugalsko (ostrovy)", elev: 2351, lat: 38.4686, lng: -28.3997, done: true, date: state['portugal'].peak.date, diff: state['portugal'].peak.diff, photo: state['portugal'].peak.photo, photoDate: state['portugal'].peak.photoDate, notes: state['portugal'].peak.note, km: state['portugal'].peak.km, elevGain: state['portugal'].peak.elevGain, time: state['portugal'].peak.time };
        await api.set("bonus_"+bId, JSON.stringify(bonusState[bId]));
      }
    }
    await api.delete("country_portugal");
    delete state['portugal'];
  }
}

/* ============================= LEAFLET MAP ============================= */
function initMap(){
  map = L.map('mapCanvas', {zoomControl: true}).setView([49, 15], 4);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
    maxZoom: 16
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
  refreshMap();
}

function refreshMap(){
  if(!map || !markersLayer) return;
  markersLayer.clearLayers();
  if(geojsonLayer) { map.removeLayer(geojsonLayer); geojsonLayer = null; }

  const allMapCountries = [...COUNTRIES, ...EXTRA_COUNTRIES];
  const isoToId = {};
  allMapCountries.forEach(c => { if(c.iso) isoToId[c.iso] = c.id; });

  if (geojsonData) {
    geojsonLayer = L.geoJSON(geojsonData, {
      style: feature => {
        const iso = feature.properties.ISO_A3;
        const cId = isoToId[iso];
        if (!cId) return { weight: 0, fillOpacity: 0 }; 

        if (getEntry(cId).peak.done) {
          return { fillColor: '#dba641', weight: 1, color: '#f0bd5f', fillOpacity: 0.15, opacity: 0.6 };
        } else {
          return { weight: 0, fillOpacity: 0 };
        }
      }
    }).addTo(map);
  }

  allMapCountries.forEach(c => {
    const e = getEntry(c.id);
    const isExtra = EXTRA_COUNTRIES.some(x => x.id === c.id);
    
    const defaultFill = isExtra ? '#173322' : '#28513a';
    const defaultStroke = isExtra ? '#365c44' : '#557a63';

    const peakColor = e.peak.done ? '#dba641' : defaultFill;
    const peakStroke = e.peak.done ? '#f0bd5f' : defaultStroke;
    const peakHtml = `<svg width="16" height="16" viewBox="-8 -8 16 16" style="filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5))"><path d="M-7 8 L0 -8 L4 0 L7 8 Z" fill="${peakColor}" stroke="${peakStroke}" stroke-width="1"/></svg>`;
    const peakIcon = L.divIcon({ html: peakHtml, className: '', iconSize: [16,16], iconAnchor: [8,8] });
    L.marker([c.peakLat, c.peakLng], {icon: peakIcon, zIndexOffset: e.peak.done ? 1000 : 0})
     .bindTooltip(`${c.peak} (${c.name})${e.peak.done?' - zdoláno':''}`)
     .on('click', () => focusCountry(c.id)).addTo(markersLayer);
  });

  Object.values(bonusState).forEach(b => {
    const lat=parseFloat(b.lat), lng=parseFloat(b.lng);
    if(isNaN(lat)||isNaN(lng)) return;
    const bColor = b.done ? '#4a7c59' : '#1c3625';
    const bStroke = b.done ? '#64a377' : '#2d543a';
    const bHtml = `<svg width="16" height="16" viewBox="-8 -8 16 16" style="filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5))"><path d="M0 -8 L2 -2.5 L8 -2 L3.2 1.6 L5 8 L0 4.2 L-5 8 L-3.2 1.6 L-8 -2 L-2 -2.5 Z" fill="${bColor}" stroke="${bStroke}" stroke-width="1"/></svg>`;
    const bIcon = L.divIcon({ html: bHtml, className: '', iconSize: [16,16], iconAnchor: [8,8] });
    L.marker([lat, lng], {icon: bIcon, zIndexOffset: b.done ? 1000 : 0})
     .bindTooltip(`${escapeHtml(b.name)}${b.done?' - zdoláno':''}`)
     .on('click', () => focusBonus(b.id)).addTo(markersLayer);
  });
}

    return `

      <div style="width:100%; font-size:13px; color:var(--text-muted); margin-bottom:8px;">Zobrazení pro sledující (pouze pro čtení). Autorský přístup:</div>
      <div style="display:flex; gap:8px; justify-content:center; align-items:center;">
        <input type="password" id="adminPw" placeholder="Zadej heslo..." style="padding:8px 12px; border-radius:8px; border:1px solid var(--border-soft); background:var(--bg-soft); color:var(--text); font-family:var(--font-body); font-size:13px; width:140px;" onkeydown="if(event.key === 'Enter') login()">
        <button class="primary-btn" onclick="login()">Odemknout</button>
      </div>
    </div>
    `;
  }
}

function sortedFilteredList(sourceArray){
  let list = sourceArray.filter(c => c.name.toLowerCase().includes(filterText.toLowerCase()) || c.peak.toLowerCase().includes(filterText.toLowerCase()));
  
  if (statusFilter === 'done') {
    list = list.filter(c => getEntry(c.id).peak.done);
  } else if (statusFilter === 'not_done') {
    list = list.filter(c => !getEntry(c.id).peak.done);
  }

  if(sortMode==='az') list = list.slice().sort((a,b)=>a.name.localeCompare(b.name,'cs'));
  else if(sortMode==='elev') list = list.slice().sort((a,b)=>b.elev-a.elev);
  else if(sortMode==='progress'){
    const score = c => getEntry(c.id).peak.done ? 1 : 0;
    list = list.slice().sort((a,b)=> score(b)-score(a) || a.name.localeCompare(b.name,'cs'));
  }
  return list;
}

function checkSVG(){ return `<svg viewBox="0 0 24 24" fill="none"><path d="M4 12 L10 18 L20 6" stroke="#0b1d14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

  const list = Object.values(bonusState).sort((a,b)=> (b.elev||0)-(a.elev||0));

    filteredList = filteredList.filter(b => b.done);

}

/* ============================= RENDER & EVENTS ============================= */
function renderAll(){
  updateHeroInPlace();
  document.getElementById('toolbarWrap').innerHTML = renderToolbar();
  
  const list = sortedFilteredList(COUNTRIES);
  
  document.getElementById('listWrap').innerHTML = list.map(renderCountryCard).join('');
  document.getElementById('bonusSectionWrap').innerHTML = renderBonusSection();
  
  document.getElementById('countPill').textContent = list.length + ' / ' + COUNTRIES.length + ' zemí';
  document.getElementById('adminPanelWrap').innerHTML = renderAdminPanel();

  attachBaseEvents();
  attachListEvents();
  attachBonusEvents();
}

function attachBaseEvents(){
  document.getElementById('searchInput').addEventListener('input', (ev)=>{
    filterText = ev.target.value;
    const list = sortedFilteredList(COUNTRIES);
    document.getElementById('listWrap').innerHTML = list.map(renderCountryCard).join('');
    
    const extraList = sortedFilteredList(EXTRA_COUNTRIES);
    const extraWrap = document.getElementById('extraListWrap');
    if(extraWrap) extraWrap.innerHTML = extraList.map(renderCountryCard).join('');
    
    document.getElementById('countPill').textContent = list.length + ' / ' + COUNTRIES.length + ' zemí';
    attachListEvents();
  });
  document.getElementById('sortSelect').addEventListener('change', (ev)=>{ sortMode = ev.target.value; renderAll(); });
  document.getElementById('filterSelect').addEventListener('change', (ev)=>{ statusFilter = ev.target.value; renderAll(); });
}

function attachListEvents(){
  document.querySelectorAll('[data-action="toggle"]').forEach(el=>{
    el.addEventListener('click', async (ev)=>{
      ev.preventDefault();
      ev.stopPropagation();
      if(!isAdmin) { alert("Jsi v režimu prohlížení (Guest mode). Pro úpravy se musíš přihlásit dole na stránce."); return; }

      const id = el.dataset.id, field = el.dataset.field;
      const e = getEntry(id);
      e[field].done = !e[field].done;
      if(e[field].done && !e.peak.date) e.peak.date = new Date().toISOString().slice(0,16);
      
      await handleSyncAndSave(id); 
      
      preserveOpenAndRerenderList(id);
      updateHeroInPlace();
      refreshMap();
    });
  });
  document.querySelectorAll('.card-body input[type="date"], .card-body input[type="datetime-local"], .card-body input[type="text"], .card-body input[type="number"], .card-body select').forEach(el=>{
    if(el.dataset.bonus) return;
    el.addEventListener('change', async ()=>{
      if(!isAdmin) return;
      const id = el.dataset.id, field = el.dataset.field, key = el.dataset.key;
      if(!field) return;
      const e = getEntry(id);
      e[field][key] = el.value;
      
      await handleSyncAndSave(id); 
      
      preserveOpenAndRerenderList(id);
      updateHeroInPlace();
      refreshMap();
    });
  });
  document.querySelectorAll('input[type="file"][data-id]').forEach(el=>{
    el.addEventListener('change', (ev)=> handlePhoto(ev, el.dataset.id, 'country'));
  });
  document.querySelectorAll('[data-action="clear"]').forEach(el=>{
    el.addEventListener('click', ()=> { 
      if(!isAdmin) return;
      if(confirm('Opravdu smazat všechna uložená data pro tuto zemi?')) clearEntry(el.dataset.id); 
    });
  });
}

function preserveOpenAndRerenderList(id){
  const card = document.getElementById('card-'+id);
  const wasOpen = card ? card.hasAttribute('open') : false;
  
  document.getElementById('listWrap').innerHTML = sortedFilteredList(COUNTRIES).map(renderCountryCard).join('');
  
  const extraWrap = document.getElementById('extraListWrap');
  if(extraWrap) extraWrap.innerHTML = sortedFilteredList(EXTRA_COUNTRIES).map(renderCountryCard).join('');
  
  attachListEvents();
  if(wasOpen){ const c2 = document.getElementById('card-'+id); if(c2) c2.setAttribute('open',''); }
}

function attachBonusEvents(){
  const saveBtn = document.getElementById('bf-save');
  if(saveBtn){
    saveBtn.addEventListener('click', async ()=>{
      if(!isAdmin) return;
      const name = document.getElementById('bf-name').value.trim();
      if(!name){ alert('Zadej název vrcholu.'); return; }
      const b = emptyBonus();
      b.id = genId();
      b.name = name;
      b.region = document.getElementById('bf-region').value.trim();
      b.elev = document.getElementById('bf-elev').value.trim();
      b.lat = document.getElementById('bf-lat').value.trim();
      b.lng = document.getElementById('bf-lng').value.trim();
      bonusState[b.id] = b;
      await saveBonus(b.id);
      
      document.getElementById('bf-name').value = '';
      document.getElementById('bf-region').value = '';
      document.getElementById('bf-elev').value = '';
      document.getElementById('bf-lat').value = '';
      document.getElementById('bf-lng').value = '';
      
      document.getElementById('bonusListWrap').innerHTML = getBonusCardsHtml();
      attachBonusEvents();
      updateHeroInPlace();
      refreshMap();
    });
  }
  document.querySelectorAll('[data-action="bonus-toggle"]').forEach(el=>{
    el.addEventListener('click', async (ev)=>{
      ev.preventDefault();
      ev.stopPropagation();
      if(!isAdmin) { alert("Jsi v režimu prohlížení (Guest mode). Pro úpravy se musíš přihlásit dole na stránce."); return; }

      const id = el.dataset.id;
      const b = bonusState[id];
      b.done = !b.done;
      if(b.done && !b.date) b.date = new Date().toISOString().slice(0,16);
      await saveBonus(id);
      
      const card = document.getElementById('bonus-'+id);
      const wasOpen = card ? card.hasAttribute('open') : false;
      document.getElementById('bonusListWrap').innerHTML = getBonusCardsHtml();
      attachBonusEvents();
      if(wasOpen){ const c2=document.getElementById('bonus-'+id); if(c2) c2.setAttribute('open',''); }
      updateHeroInPlace();
      refreshMap();
    });
  });
  document.querySelectorAll('[data-bonus]').forEach(el=>{
    if(el.type === 'button') return;
    el.addEventListener('change', async ()=>{
      if(!isAdmin) return;
      const id = el.dataset.bonus, key = el.dataset.key;
      bonusState[id][key] = el.value;
      await saveBonus(id);
      const card = document.getElementById('bonus-'+id);
      const wasOpen = card ? card.hasAttribute('open') : false;
      document.getElementById('bonusListWrap').innerHTML = getBonusCardsHtml();
      attachBonusEvents();
      if(wasOpen){ const c2=document.getElementById('bonus-'+id); if(c2) c2.setAttribute('open',''); }
      refreshMap();
    });
  });
  document.querySelectorAll('input[type="file"][data-bonusphoto]').forEach(el=>{
    el.addEventListener('change', (ev)=> handlePhoto(ev, el.dataset.bonusphoto, 'bonus'));
  });
  document.querySelectorAll('[data-action="bonus-delete"]').forEach(el=>{
    el.addEventListener('click', ()=> { 
      if(!isAdmin) return;
      if(confirm('Opravdu smazat tento vrchol?')) deleteBonus(el.dataset.id); 
    });
  });
}

/* ============================= PHOTO ============================= */
async function handlePhoto(ev, id, kind){
  if(!isAdmin) return;
  const fileInput = ev.target;
  let file = fileInput.files[0];
  if(!file) return;

  let isConverted = false;

  if (file.name.toLowerCase().endsWith('.heic') || file.name.toLowerCase().endsWith('.heif') || file.type === 'image/heic') {
    try {
      showSaving(true);
      const ind = document.getElementById('saveIndicator');
      if(ind) ind.textContent = 'Zpracovávám HEIC…';
      
      const convertedBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.8 });
      const convertedFile = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
      file = new File([convertedFile], file.name.replace(/\.heic$/i, '.jpg').replace(/\.heif$/i, '.jpg'), { type: 'image/jpeg' });
      isConverted = true;
      
      showSaving(false);
    } catch (e) {
      console.error("HEIC konverze selhala", e);
      alert("Nepodařilo se zpracovat formát HEIC z iPhonu. Zkuste nahrát klasický JPEG.");
      showSaving(false);
      fileInput.value = '';
      return;
    }
  }

  let finished = false;
  const proceed = (exifDateStr) => {
    if(finished) return;
    finished = true;
    finishPhotoProcessing(file, id, exifDateStr, kind);
    fileInput.value = ''; 
  };

  if (isConverted) {
    proceed("");
    return;
  }

  try{
    EXIF.getData(file, function(){
      const raw = EXIF.getTag(this, "DateTimeOriginal") || EXIF.getTag(this, "DateTime");
      let exifDateStr = "";
      if(raw){
        const iso = raw.replace(/^(\d{4}):(\d{2}):(\d{2})/, '$1-$2-$3').replace(' ', 'T').slice(0,16);
        exifDateStr = iso;
      }
      proceed(exifDateStr);
    });
    setTimeout(() => proceed(""), 1500);
  }catch(e){ 
    proceed(""); 
  }
}

function finishPhotoProcessing(file, id, exifDateStr, kind){
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = async function(){
      const maxW = 900;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);

      if(kind==='country'){
        const e = getEntry(id);
        e.peak.photo = dataUrl;
        e.peak.photoDate = exifDateStr;
        if(exifDateStr && !e.peak.date) e.peak.date = exifDateStr;
        
        await handleSyncAndSave(id); 
        preserveOpenAndRerenderList(id);
      } else {
        const b = bonusState[id];
        b.photo = dataUrl;
        b.photoDate = exifDateStr;
        if(exifDateStr && !b.date) b.date = exifDateStr;
        await saveBonus(id);
        const card = document.getElementById('bonus-'+id);
        const wasOpen = card ? card.hasAttribute('open') : false;
        document.getElementById('bonusListWrap').innerHTML = getBonusCardsHtml();
        attachBonusEvents();
        if(wasOpen){ const c2=document.getElementById('bonus-'+id); if(c2) c2.setAttribute('open',''); }
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

  await Promise.all([loadAll(), loadGeoJson()]);
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('appContent').style.display = 'block';
  renderAll();
  initMap();
})();
